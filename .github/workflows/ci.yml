name: CI

# 本仓最小门禁（ADR-D29 R2「单仓可自证」）：格式 + 构建 + 静态检查 + 测试。
# 本仓**不得** checkout 其他仓 —— 需要别的仓源码才能过，就是边界画错了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest
    # ORCH-CI-GATES：真库腿。库侧用例原本按设计 skip（见 AGENTS.md §2），
    # 这里起隔离 PG 并注入 DSN，让它们真跑。临时库，绝不指向部署库。
    #
    # 迁移入口：本仓无 migrations 目录，DDL 由 internal/pgstore 内嵌，
    # 真库用例在打开 store 时执行；因此这里不另设迁移步骤（手写 SQL 会与内嵌 DDL 双写漂移）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellurion_orchestration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tellurion_orchestration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORCHESTRATION_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion_orchestration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: gofmt（未格式化即红）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门（2026-11-12 回补）。
      # 首轮只升了 pin、没加门——依赖升级与漏洞检测拆开，pin 里带已知漏洞也能全绿。
      # govulncheck 按“符号级可达性”判定，只对真正被调用到的漏洞报红。
      # 破坏验证：把 kit / pgx 降回旧 pin ⇒ 本步以 GO-2026-5004 等 ID 报红；还原 ⇒ EXIT=0。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # 覆盖率门（ORCH-CI-GATES）：基线 = 2026-11-13 在隔离 PG 16 上实跑
      # `go test ./... -count=1 -coverprofile=coverage.out` 的 total 56.4%；
      # 取整 56 - 5 = 51%（口径见 AGENTS.md §2）。低于门 exit 1。
      - name: Test（真库腿 + 覆盖率门）
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          if [ -z "$total" ]; then
            echo "覆盖率门：未能从 coverage.out 解析 total"
            exit 1
          fi
          echo "total coverage: ${total}%（门：51%）"
          awk -v t="$total" 'BEGIN { if (t + 0 < 51.0) { printf("覆盖率门红：%.1f%% < 51%%（基线 56.4% 取整 56 - 5）\n", t); exit 1 } }'

      - name: Test（-race，数据竞争即红）
        run: go test -race ./... -count=1

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
