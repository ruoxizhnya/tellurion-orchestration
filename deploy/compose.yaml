# tellurion-orchestration · 单仓本地运行（ADR-036 G0）
# 用法：docker compose -f deploy/compose.yaml up --build
# 依赖：本机或容器可达的 PostgreSQL（默认 host.docker.internal:5432）。
# DSN 为空时本服务按设计拒绝启动（fail-closed）。
name: tellurion-orchestration

services:
  orchestration:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tellurion-orchestration:dev
    command: ["-addr", "0.0.0.0:8088"]
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      ORCHESTRATION_DSN: ${ORCHESTRATION_DSN:-postgres://postgres:postgres@host.docker.internal:5432/tellurion?sslmode=disable}
      # 凭证来源（QT-77）：验签方口径本服务**已全量持证**——`SVC-ORCH-G1`
      # （2026-11-09）起 `/api/*` 16 条路由全部 service 角色；`/healthz` /
      # `/readyz` 公开。R5 最小面先由 `SVC-ORCH-G2` 覆盖 artifact 写端点。
      # 空值 = 第 2 态：读端点公开，写端点 503 auth_unavailable（不再有公开默认 secret）。
      # 要写必须由部署方注入 JWT_SECRET，并给调用方（core worker / analysis）配套 token。
      # 签发/轮换见 tellurion:docs/SPEC.md 的「服务间凭证」节。
      JWT_SECRET: ${JWT_SECRET:-}
      # 显式开放声明（第 3 态）：填 loopback-published 后**任何绑定**都放开写面，
      # 启动 WARN 会点名写面无鉴权与绑定地址（非回环附加「已对外暴露」）。
      # 默认留空 = 不声明；要开放必须由部署者显式给出并承担 WARN 的后果。
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped